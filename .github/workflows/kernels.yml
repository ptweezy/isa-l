name: adler32 and crc32_iscsi kernels on many runners

on:
  push:
    branches:
      - ci-kernels
  workflow_dispatch:

permissions:
  contents: read

env:
  PR445: 29dc7f377d3652c96e54413eb215af8d5205a149   # AVX-512 adler32
  CRC: c1b6b3f23f69aa5a73d78f5536f30fc843db4d8e     # x86-crc32-iscsi-zen5

jobs:
  # Many short runs, since each can land on a different CPU model
  linux:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y nasm
      - name: Build
        run: bash .github/bench/prepare.sh pr445:$PR445 crc:$CRC
      - name: Kernels
        run: |
          bash .github/bench/cpu.sh
          cd ~/isal
          gcc -O2 -DNO_CRC32_ISCSI_FUSED $GITHUB_WORKSPACE/.github/bench/kab.c pr445/bin/isa-l.a -o kab_pr445
          gcc -O2 -DNO_ADLER32_AVX512 $GITHUB_WORKSPACE/.github/bench/kab.c crc/bin/isa-l.a -o kab_crc
          for i in 1 2 3; do ./kab_pr445; ./kab_crc; done
      - name: Checker
        run: |
          cd ~/isal
          grep -q avx512_vbmi2 /proc/cpuinfo || { echo "no AVX-512 group 2"; exit 0; }
          for t in pr445 crc; do
            gcc -O2 $GITHUB_WORKSPACE/.github/bench/t445.c $t/bin/isa-l.a -o t445_$t
            addr() { nm t445_$t | awk -v s="$1" '$3==s {print "0x"$1}'; }
            oa=$(($(addr isal_adler32_dispatched) - $(addr isal_adler32)))
            oc=$(($(addr crc32_iscsi_dispatched) - $(addr crc32_iscsi)))
            ./t445_$t $oa $oc 0 | grep -E -- "->|TOTAL"
          done

  windows:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install nasm
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Format-List Name
      - name: Build and run the kernels
        shell: bash
        run: |
          for t in pr445:$PR445:-DNO_CRC32_ISCSI_FUSED crc:$CRC:-DNO_ADLER32_AVX512; do
            IFS=: read name commit def <<< "$t"
            mkdir -p /c/t/$name
            git archive $commit | tar -x -C /c/t/$name
            make -C /c/t/$name -j $(nproc) -f Makefile.unx lib SIM= arch=mingw host_cpu=x86_64 AR=x86_64-w64-mingw32-gcc-ar > /dev/null
            gcc -O2 $def .github/bench/kab.c /c/t/$name/bin/isa-l.a -o /c/t/kab_$name.exe
          done
          for i in 1 2 3; do /c/t/kab_pr445.exe; /c/t/kab_crc.exe; done
