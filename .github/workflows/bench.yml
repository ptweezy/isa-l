name: inflate-bench

on:
  push:
    branches: [inflate-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Machine
      run: |
        uname -a
        sysctl -n machdep.cpu.brand_string 2>/dev/null || lscpu | grep -E 'Model name|Vendor ID'
        cc --version
    - name: Install nasm
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: sudo apt-get install -y nasm
    - name: Build
      run: bash build.sh
    - name: Build again with zlib-ng develop
      run: ZNG_REF=develop WORK=$PWD/work-zng-dev OUT=$PWD/bench-zng-dev bash build.sh
    - name: Build again with ISA-L master
      continue-on-error: true
      run: ISAL_REF=master WORK=$PWD/work-isal-master OUT=$PWD/bench-isal-master bash build.sh
    - name: Build again with intel/isa-l#465 (aarch64 inflate fast path)
      continue-on-error: true
      run: >-
        ISAL_REPO=https://github.com/ptweezy/isa-l ISAL_REF=igzip-aarch64-inflate-fast-path
        WORK=$PWD/work-isal-465 OUT=$PWD/bench-isal-465 bash build.sh
    - name: Build again with the c0-infl stack
      continue-on-error: true
      run: >-
        ISAL_REPO=https://github.com/ptweezy/isa-l ISAL_REF=c0-infl
        WORK=$PWD/work-isal-c0 OUT=$PWD/bench-isal-c0 bash build.sh
    - uses: actions/cache@v4
      with:
        path: corpus
        key: corpora-v1
    - name: Corpora
      run: bash tools/corpora.sh
    - name: Native benchmark
      run: ./bench --max-mb 256 --dump corpus corpus/SRR2589044_1.fastq corpus/silesia.cat
    - name: Native benchmark, zlib-ng develop (system zlib repeated as a control)
      run: ./bench-zng-dev --max-mb 256 --only "zlib-ng,system zlib" corpus/SRR2589044_1.fastq corpus/silesia.cat
    - name: Native benchmark, ISA-L variants (system zlib repeated as a control)
      run: |
        for v in master 465 c0; do
          if [ -x ./bench-isal-$v ]; then
            echo "#### ISA-L variant: $v"
            ./bench-isal-$v --max-mb 256 --only "ISA-L,system zlib" corpus/SRR2589044_1.fastq corpus/silesia.cat
          else
            echo "#### ISA-L variant $v did not build"
          fi
        done
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Python wheels on the same streams
      run: |
        python -m pip install -q isal==1.9.1 zlib-ng==1.1.0
        python tools/wheels.py corpus/*.ref.gz
    - name: SIMD symbols in the wheels
      run: |
        for m in isal.isal_zlib zlib_ng.zlib_ng; do
          f=$(python -c "import importlib; print(importlib.import_module('$m').__file__)")
          echo "== $m: $(basename "$f")"
          nm "$f" 2>/dev/null | grep -i -E "neon|armv8|acle|pmull|aarch64|avx2|pclmul" | awk '{print $NF}' | sort -u | head -40 || true
        done
